name: forever-hotel-kms

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: kms-backend
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: 'postgresql://forever:${POSTGRES_PASSWORD}@postgres:5432/forever_hotel'
      DATABASE_SSL: 'false'

      # Required for reliable file watching with Docker Desktop bind mounts.
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '1000'
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling

    depends_on:
      postgres:
        condition: service_healthy
        
    ports:
      - '3001:3001'
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    networks:
      - kms-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: kms-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001

      # Required for reliable file watching with Docker Desktop bind mounts.
      WATCHPACK_POLLING: 'true'
      
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    networks:
      - kms-network

  postgres:
    image: postgres:15-alpine
    container_name: kms-postgres
    environment:
      POSTGRES_DB: forever_hotel
      POSTGRES_USER: forever
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'

    # Development database is intentionally ephemeral.
    # SDS §7.4 specifies an ephemeral PostgreSQL container for local development.
    # All database contents are lost when the PostgreSQL container is restarted
    # or recreated.
    tmpfs:
      - /var/lib/postgresql/data
    
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U forever -d forever_hotel',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kms-network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: kms-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: kms
      RABBITMQ_DEFAULT_PASS: kms_dev
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test:
        ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kms-network

volumes:
  backend_node_modules:
  frontend_node_modules:
  frontend_next:

networks:
  kms-network:
    driver: bridge