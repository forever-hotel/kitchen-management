name: KMS CI

on:
  push:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend Quality
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: forever_hotel_test
          POSTGRES_USER: forever_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forever_test -d forever_hotel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgresql://forever_test@localhost:5432/forever_hotel_test
      DATABASE_SSL: 'false'

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Set up npm
        run: npm install --global npm@12.1.0

      - name: Install backend dependencies
        run: npm ci

      - name: Audit backend dependencies
        run: npm run security:audit

      - name: Check backend formatting
        run: npm run format:check

      - name: Lint backend
        run: npm run lint

      - name: Run backend tests
        run: npm test

      - name: Run backend E2E tests
        run: npm run test:e2e

      - name: Build backend
        run: npm run build

  frontend:
    name: Frontend Quality
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up npm
        run: npm install --global npm@12.1.0

      - name: Install frontend dependencies
        run: npm ci
      
      - name: Audit frontend dependencies
        run: npm run security:audit

      - name: Check frontend formatting
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend tests
        run: npm run test:ci

      - name: Build frontend
        run: npm run build